            </ul>
        </nav>
    </div>
    <div class="contacto"></div>
    <h1>Formulario de contacto</h1>
    <hr>
    <br>
    <div class="form">
        <form action="/formulario" method="post">
            <div class="campo">
                <label for="nombre">Nombre Completo</label>
                <input id="nombre" name="nombre" placeholder="Ej. Paul Mc Cartney">
            </div>
            <br>
            <div class="campo">
                <label for="email">Correo Electronico</label>
                <input id="email" name="email" placeholder="Ej. jhonlennon@hotmail">
            </div>
            <br>
            <div class="campo">
                <label for="asunto">Asunto</label>
                <select name="asunto" id="asunto">
                    <option value="">--- Seleccione la opcion ---</option>
                    <option value="consulta discografica">Saber mas de la discografia</option>
                    <option value="consulta beateles">Saber mas de The Beatles</option>
                    <option value="consulta integrantes">Saber mas de los integrantes</option>
                    <option value="otras consultas ">Otras consultas</option>
                </select>

            </div>
            <br>
            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea name="mensaje" id="mensaje" rows="4" placeholder="Escriba aqui su consulta"
                    required></textarea>

            </div>
            <br>
            <button type="submit">Enviar Formulario</button>
        </form>
        <div>
            <img src="./pics/bandaCompleta.jpg" alt="">
        </div>
    </div>
